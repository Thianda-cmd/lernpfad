<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lernpfad – Werkzeuge für die BTA-Ausbildung: Rechner mit vollständigem Lösungsweg, Periodensystem, Stoffmenge und Lösungen, Zellmodelle in 3D und mehr für Biologie, Chemie und Mathematik." />
    <meta name="theme-color" content="#f3f1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Lernpfad · BTA</title>
    <script>
      try {
        var t = localStorage.getItem('lernlabor-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('lernlabor-intro') !== 'aus') document.documentElement.classList.add('intro-pending');
      } catch (e) {
        document.documentElement.classList.add('intro-pending');
      }
    </script>
    <style>
      /* Papierton der Start-Animation, bevor das Stylesheet geladen ist */
      html.intro-pending,
      html.intro-pending body {
        background: #f3f1eb;
      }
      @media (prefers-color-scheme: dark) {
        html.intro-pending:not([data-theme='light']),
        html.intro-pending:not([data-theme='light']) body {
          background: #0f1412;
        }
      }
      html.intro-pending[data-theme='dark'],
      html.intro-pending[data-theme='dark'] body {
        background: #0f1412;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
