<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LernLabor – deine Lernplattform für die BTA-Ausbildung: Biologie, Chemie und Mathematik interaktiv lernen." />
    <meta name="theme-color" content="#0f1412" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>LernLabor · BTA</title>
    <script>
      try {
        var t = localStorage.getItem('lernlabor-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('lernlabor-intro') !== 'aus') document.documentElement.classList.add('intro-pending');
      } catch (e) {
        document.documentElement.classList.add('intro-pending');
      }
    </script>
    <style>
      html.intro-pending,
      html.intro-pending body {
        background: #0c2219;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
